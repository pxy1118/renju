[project]
name = "renju"
version = "0.1.0"
description = "Visk — dual-rule Gomoku/Renju AlphaZero self-play training"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.5.3",
    "pillow==12.3.0",
    "pytest==8.4.2",
    "torch==2.14.0",
    "torchaudio==2.11.0",
    "torchvision==0.29.0",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["integration: requires a user-supplied external engine"]
